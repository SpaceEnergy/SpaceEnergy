name: Update profile art

# Refreshes the contribution heatmap + info card SVGs from real data.

on:
  schedule:
    - cron: '17 6 * * *' # daily ~06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-profile-art.yml']

# same group as update-stats.yml so the two never push at the same time
concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: scripts/requirements.txt

    - name: Install dependencies
      run: pip install -r scripts/requirements.txt

    - name: Fetch contribution data (public, no token)
      run: python scripts/fetch_contributions.py

    - name: Render SVGs
      run: |
        python scripts/render_heatmap_svg.py
        python scripts/make_info_card.py

    - name: Commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/contributions.json contrib-heatmap.svg info-card.svg
        git diff --cached --quiet && exit 0
        git commit -m "update profile art [skip ci]"
        git pull --rebase
        git push
